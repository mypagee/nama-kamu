<style>
:root{
  --c1:#000000; --c2:#ffffff; --c3:#000000; --c4:#000000;
  --glass:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.28);
  --edge:rgba(255,255,255,.4); --text:#faf5ff; --muted:rgba(255,255,255,.78);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0; min-height:100%; font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text); background:#000;
  display:flex; align-items:center; justify-content:center; padding:0 18px 32px; overflow-x:hidden;
}
/* latar gradien menempel di layar: tetap menyambung berapa pun jumlah tombolnya */
body::before{
  content:""; position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
  background:linear-gradient(160deg,#000000,#000000 55%,#9D30F3);
}
/* blob cair di belakang kaca */
.blob{position:fixed; border-radius:50%; filter:blur(50px); opacity:.75; z-index:0; will-change:transform}
.b1{width:340px;height:340px;background:radial-gradient(circle at 30% 30%,var(--c4),var(--c3) 60%,transparent 72%);top:-60px;left:-80px;animation:drift1 14s ease-in-out infinite alternate}
.b2{width:420px;height:420px;background:radial-gradient(circle at 60% 40%,#9D30F3,#000000 62%,transparent 74%);bottom:-120px;right:-120px;animation:drift2 18s ease-in-out infinite alternate}
.b3{width:240px;height:240px;background:radial-gradient(circle,#000000,#000000 60%,transparent 72%);top:42%;left:55%;animation:drift3 16s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(160px,200px) scale(1.25)}}
@keyframes drift2{to{transform:translate(-200px,-140px) scale(.85)}}
@keyframes drift3{to{transform:translate(-220px,120px) scale(1.3)}}

.card{
  position:relative; z-index:1; width:100%; max-width:400px; padding:34px 24px 26px; text-align:center;
  border-radius:36px; background:none; border:1px solid transparent;
  animation:float 7s ease-in-out infinite;
}
/* kilau kaca mengikuti kursor */
.card::before{
  content:""; display:none; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.34),transparent 50%);
}
@keyframes float{50%{transform:translateY(-8px)}}

/* sampul di belakang foto profil (seperti WhatsApp Business) */
.cover{
  position:relative; width:100vw; height:182px; margin:-34px 0 0 calc(50% - 50vw); overflow:hidden;
  border-radius:0; background:#000;
}
.cover img{width:100%; height:100%; object-fit:cover; display:block}
.cover::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.45));
}
.avatar-wrap{position:relative; z-index:2; width:104px; height:104px; margin:-52px auto 18px}
.verified{
  position:absolute; right:10px; bottom:5px; z-index:3; width:20px; height:20px; display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.avatar{
  position:relative; width:104px; height:104px; margin:0; border-radius:50%; padding:3px;
  box-shadow:0 0 0 4px #0b0b0b;
  background:conic-gradient(from 0deg,#fff,var(--c3),var(--c2),var(--c4),#fff);
  animation:spin 6s linear infinite;
}
.avatar span{
  display:grid; place-items:center; width:100%; height:100%; border-radius:50%;
  background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.25));
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  font-size:38px; font-weight:700; animation:spin 6s linear infinite reverse;
}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
@keyframes spin{to{transform:rotate(360deg)}}

h1{margin:0 0 4px; font-size:26px; font-weight:700; letter-spacing:-.02em}
.handle{margin:0 0 14px; color:var(--muted); font-size:14px}
.bio{margin:0 auto 26px; max-width:30ch; color:var(--muted); font-size:14px; line-height:1.65; font-weight:300}
.bio b{color:var(--text); font-weight:600; border-right:2px solid var(--c4); padding-right:3px; animation:blink .8s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}

.links{display:grid; gap:12px}
.link{
  position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; padding:14px 18px;
  border-radius:22px; color:var(--text); text-decoration:none; text-align:left;
  background:linear-gradient(135deg,var(--glass-hi),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.32);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55), 0 8px 22px rgba(0,0,0,.4);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s, background .3s;
  opacity:0; transform:translateY(24px); animation:in .7s cubic-bezier(.2,.9,.3,1) forwards;
}
.link:nth-child(1){animation-delay:.25s}.link:nth-child(2){animation-delay:.4s}.link:nth-child(3){animation-delay:.55s}
@keyframes in{to{opacity:1; transform:none}}
/* kilatan cahaya saat hover */
.link::after{
  content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-20deg); transition:left .7s;
}
.link:hover,.link:focus-visible{transform:translateY(-3px) scale(1.03); box-shadow:inset 0 1px 1px rgba(255,255,255,.8), 0 16px 34px rgba(0,0,0,.5); outline:none}
.link:hover::after,.link:focus-visible::after{left:130%}
.link:active{transform:scale(.97)}
.link:focus-visible{outline:2px solid #fff; outline-offset:3px}
.ico{flex:none; display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.2); box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.ico svg{width:22px; height:22px; fill:#fff}
.t{display:flex; flex-direction:column; line-height:1.3}
.t strong{font-size:15px; font-weight:600}
.t small{font-size:12px; color:var(--muted); font-weight:300}
.arrow{margin-left:auto; opacity:.7; transition:transform .3s}
.link:hover .arrow{transform:translateX(4px)}
.foot{margin:22px 0 0; font-size:10px; color:var(--muted); font-weight:300}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
  .link{opacity:1; transform:none}
}
</style>
</head>

  (C.tombolLain||[]).forEach(t=>{
    if(!t||!String(t.link||'').trim()||!String(t.nama||'').trim())return;
    let url=String(t.link).trim();
    // Pesan otomatis WhatsApp opsional, diambil dari CONFIG.pesanWA.
    if(String(t.ikon||'').toLowerCase()==='whatsapp' && C.pesanWA && /^https?:\/\/wa\.me\//i.test(url)){
      url += (url.includes('?')?'&':'?')+'text='+encodeURIComponent(C.pesanWA);
    }
    if(t.ikon==='email'&&!/^mailto:/i.test(url))url='mailto:'+url;
    else if(t.ikon==='telepon'&&!/^tel:/i.test(url))url='tel:+'+url.replace(/\D/g,'');
    else if(!/^[a-z][a-z0-9+.-]*:/i.test(url))url='https://'+url.replace(/^\/+/,'');
    if(!/^(https?:|mailto:|tel:)/i.test(url))return;
    const a=document.createElement('a');
    a.className='link'; a.href=url; a.target='_blank'; a.rel='noopener';
    a.innerHTML='<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+(IKON[String(t.ikon||'link').toLowerCase()]||IKON.link)+'</svg></span><span class="t"><strong></strong><small></small></span>'+PANAH;
    a.querySelector('strong').textContent=t.nama;
    nav.appendChild(a);
  });
  nav.querySelectorAll('.link').forEach((a,i)=>{a.style.animationDelay=(.25+.15*i)+'s'});
  $('foot').textContent=C.footer||'';
  if(!C.footer)$('foot').style.display='none';
  if(C.musik){
    const a=new Audio(C.musik); a.loop=true; a.volume=C.volumeMusik;
    const start=()=>{a.play().catch(()=>{});
      document.removeEventListener('click',start);
      document.removeEventListener('touchstart',start)};
    document.addEventListener('click',start);
    document.addEventListener('touchstart',start);
  }
})();
</script>

<script>
// kilau kaca mengikuti kursor / sentuhan
const card=document.getElementById('card');
function glow(x,y){const r=card.getBoundingClientRect();card.style.setProperty('--mx',(x-r.left)+'px');card.style.setProperty('--my',(y-r.top)+'px')}
window.addEventListener('pointermove',e=>glow(e.clientX,e.clientY));

// teks mengetik berganti-ganti
const words=[CONFIG.bio||''];
const el=document.getElementById('typed');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(still){el.textContent=words[0]}else{
  let w=0,i=0,del=false;
  (function tick(){
    const word=words[w];
    el.textContent=word.slice(0,i);
    if(!del&&i===word.length){del=true;return setTimeout(tick,1500)}
    if(del&&i===0){del=false;w=(w+1)%words.length}
    i+=del?-1:1;
    setTimeout(tick,del?40:85);
  })();
}
</script>
